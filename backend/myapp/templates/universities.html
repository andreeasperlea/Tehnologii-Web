{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="{% static 'CSS/universities_style.css' %}">
    <title>Universități din România</title>
</head>

<body>

    <div>
        <h1>Universități din România</h1>

        <label for="q">Filtru (opțional):</label>

        <div id="status" class="status"></div>

    <button id="export-btn">Export CSV</button>

    <script src="{% static 'JS/universities.js' %}"></script>
</body>
</html>
